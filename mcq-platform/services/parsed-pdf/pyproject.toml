[tool.poetry]
name = "mcq-parsed-pdf"
version = "0.1.0"
description = "Dependencies for the parsed-pdf component of the MCQ platform."
authors = ["MCQ Platform <dev@mcq-platform.local>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
"pydantic" = "2.8.2"
"pydantic-settings" = "2.3.4"
"structlog" = "24.2.0"
"orjson" = "3.10.3"
"python-dotenv" = "1.0.1"
"tenacity" = "8.3.0"
"fastapi" = "0.115.0"
"uvicorn" = { version = "0.30.1", extras = ["standard"] }
"nats-py" = "2.4.0"
"paddleocr" = "2.7.3"
"paddlepaddle-gpu" = "2.6.2"
"opencv-python-headless" = "4.10.0.84"
"pdfminer.six" = "20231228"
"unstructured" = "0.14.9"
"numpy" = "1.26.4"
"pillow" = "10.4.0"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
