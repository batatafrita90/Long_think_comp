[tool.poetry]
name = "mcq-workflow-agentes"
version = "0.1.0"
description = "Dependencies for the workflow-agentes component of the MCQ platform."
authors = ["MCQ Platform <dev@mcq-platform.local>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
"pydantic" = "2.8.2"
"pydantic-settings" = "2.3.4"
"structlog" = "24.2.0"
"orjson" = "3.10.3"
"python-dotenv" = "1.0.1"
"tenacity" = "8.3.0"
"fastapi" = "0.115.0"
"uvicorn" = { version = "0.30.1", extras = ["standard"] }
"nats-py" = "2.4.0"
"langchain" = "0.2.7"
"langchain-community" = "0.2.7"
"langchain-openai" = "0.1.13"
"langgraph" = "0.1.8"
"langfuse" = "2.4.1"
"qdrant-client" = "1.9.0"
"psycopg" = { version = "3.2.1", extras = ["binary"] }
"sqlalchemy" = "2.0.35"
"opentelemetry-api" = "1.25.0"
"opentelemetry-sdk" = "1.25.0"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
