[tool.poetry]
name = "mcq-janitor"
version = "0.1.0"
description = "Dependencies for the janitor component of the MCQ platform."
authors = ["MCQ Platform <dev@mcq-platform.local>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
"pydantic" = "2.8.2"
"pydantic-settings" = "2.3.4"
"structlog" = "24.2.0"
"orjson" = "3.10.3"
"python-dotenv" = "1.0.1"
"tenacity" = "8.3.0"
"fastapi" = "0.115.0"
"uvicorn" = { version = "0.30.1", extras = ["standard"] }
"qdrant-client" = "1.9.0"
"schedule" = "1.2.2"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
