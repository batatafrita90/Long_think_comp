[tool.poetry]
name = "mcq-reviewer-proxy"
version = "0.1.0"
description = "Dependencies for the reviewer-proxy component of the MCQ platform."
authors = ["MCQ Platform <dev@mcq-platform.local>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
"pydantic" = "2.8.2"
"pydantic-settings" = "2.3.4"
"structlog" = "24.2.0"
"orjson" = "3.10.3"
"python-dotenv" = "1.0.1"
"tenacity" = "8.3.0"
"fastapi" = "0.115.0"
"uvicorn" = { version = "0.30.1", extras = ["standard"] }
"langchain" = "0.2.7"
"langchain-openai" = "0.1.13"
"httpx" = "0.25.2"
"typer" = "0.12.5"
"redis" = "5.0.7"

[build-system]
requires = ["poetry-core>=1.7.0"]
build-backend = "poetry.core.masonry.api"
