openapi: 3.1.3
info:
  title: Metrics Engine
  version: 0.1.0
servers:
  - url: http://localhost:8083
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: Service is healthy
  /.well-known/info:
    get:
      summary: Service metadata
      responses:
        "200":
          description: Metadata document
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        "200":
          description: Metrics payload
  /api/v1/metrics/user/{user_id}:
    get:
      summary: Retrieve aggregated metrics for a user
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User metrics snapshot
  /api/v1/metrics/session/{execution_id}:
    get:
      summary: Retrieve metrics for a session execution
      parameters:
        - name: execution_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session metrics snapshot
